<style>
body {
  font-family: Arial;
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

h1 {
  color: navy;
}

.section {
  margin-bottom: 25px;
}

textarea {
  width: 100%;
  height: 120px;
  font-size: 16px;
  padding: 10px;
}

select {
  font-size: 16px;
  padding: 8px;
}

button {
  background-color: lightblue;
  padding: 10px;
  cursor: pointer;
}

button:hover {
  background-color: skyblue;
}
</style>

<h1>📝 Reflection Hub</h1>
<button id="loginBtn">Googleでログイン</button>
<button id="logoutBtn">ログアウト</button>
<p id="userInfo">ログインしていません</p>

<p>今日の授業を思い出しながら、何も見ないで振り返ろう。</p>

<div class="section">
  <h3>① Today's Reflection</h3>
  <p>今日学んだこと・理解できたこと・気づいたこと</p>
  <textarea id="reflection"
    placeholder="例：今日は比較級の使い方を学んだ。more を使う形と -er をつける形の違いが少しわかった。"></textarea>
</div>

<div class="section">
  <h3>② Questions & Expressions</h3>
  <p>疑問に思ったこと・Small Talkで言いたかったけど言えなかった表現</p>
  <textarea id="question"
    placeholder="例：「雰囲気が崩れる」って英語でどう言えばいいかわからなかった。"></textarea>
</div>

<div class="section">
  <h3>③ Message to Teacher</h3>
  <p>先生に伝えたいこと・聞きたいこと</p>
  <textarea id="message"
    placeholder="例：次回もう一度、関係詞の説明を聞きたいです。"></textarea>
</div>

<div class="section">
  <h3>⭐ Self Evaluation</h3>
  <p>今日の理解度を選んでください。</p>

  <select id="evaluation">
    <option>5 😀 よく理解できた</option>
    <option>4 🙂 だいたい理解できた</option>
    <option>3 😐 ふつう</option>
    <option>2 😕 少し難しかった</option>
    <option>1 😵 かなり難しかった</option>
  </select>
</div>

<button id="submitBtn">提出する</button>

<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

  import {
  getFirestore,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
  import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyC0v6j94bU_51gk3UxkD9XJevhJ128Xtzo",
    authDomain: "ganmo-reflection-hub.firebaseapp.com",
    projectId: "ganmo-reflection-hub",
    storageBucket: "ganmo-reflection-hub.firebasestorage.app",
    messagingSenderId: "308447845168",
    appId: "1:308447845168:web:f97ffa59996d78d29406f5"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
const provider = new GoogleAuthProvider();
  document.getElementById("loginBtn").addEventListener("click", async () => {
  await signInWithPopup(auth, provider);
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
});

let currentUser = null;

onAuthStateChanged(auth, (user) => {
  currentUser = user;

  if (user) {
    document.getElementById("userInfo").innerHTML =
      `${user.displayName} さんでログイン中`;
  } else {
    document.getElementById("userInfo").innerHTML =
      "ログインしていません";
  }
});

  document.getElementById("submitBtn").addEventListener("click", async () => {

  const reflection =
    document.getElementById("reflection").value;

  const question =
    document.getElementById("question").value;

  const message =
    document.getElementById("message").value;

  const evaluation =
    document.getElementById("evaluation").value;

  try {

    await addDoc(
      collection(db, "reflections"),
     {
  userName: currentUser ? currentUser.displayName : "未ログイン",
  userEmail: currentUser ? currentUser.email : "未ログイン",
  userId: currentUser ? currentUser.uid : "未ログイン",
  reflection: reflection,
  question: question,
  message: message,
  evaluation: evaluation,
  createdAt: new Date()
}
    );

    alert("提出完了！");

  } catch (error) {

    console.error(error);

    alert("保存に失敗しました");

  }

});
</script>
