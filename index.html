<style>
body {
  font-family: Arial;
  max-width: 800px;
  margin: auto;
  padding: 20px;
}

h1 {
  color: navy;
}

.section {
  margin-bottom: 25px;
}

textarea {
  width: 100%;
  height: 120px;
  font-size: 16px;
  padding: 10px;
}

select {
  font-size: 16px;
  padding: 8px;
}

button {
  background-color: lightblue;
  padding: 10px;
  cursor: pointer;
}

button:hover {
  background-color: skyblue;
}
</style>

<h1>📝 Reflection Hub</h1>
<button id="loginBtn">Googleでログイン</button>
<button id="logoutBtn">ログアウト</button>
<p id="userInfo">ログインしていません</p>

<hr>

<h3>🏫 学校メールでログイン</h3>

<input
  id="email"
  type="email"
  placeholder="学校メールアドレス"
/>

<br><br>

<input
  id="password"
  type="password"
  placeholder="パスワード"
/>

<br><br>

<button id="emailLoginBtn">
  ログイン
</button>

<button id="signupBtn">
  初回登録
</button>

<hr>

<p>今日の授業を思い出しながら、何も見ないで振り返ろう。</p>

<div class="section">
  <h3>🏫 Class Information</h3>

  <p>学年</p>
  <select id="grade">
    <option>1年</option>
    <option>2年</option>
    <option>3年</option>
  </select>

  <p>クラス</p>
  <select id="className">
    <option>1組</option>
    <option>2組</option>
    <option>3組</option>
    <option>4組</option>
    <option>5組</option>
    <option>6組</option>
    <option>7組</option>
    <option>8組</option>
  </select>

  <p>授業名</p>
  <select id="lessonName">
    <option>英語コミュニケーションⅠ</option>
    <option>英語コミュニケーションⅡ</option>
    <option>英語コミュニケーションⅢ</option>
    <option>論理・表現Ⅰ</option>
    <option>論理・表現Ⅱ</option>
    <option>論理・表現Ⅲ</option>
  </select>
</div>
<div class="section">
  <h3>① Today's Reflection</h3>
  <p>今日学んだこと・理解できたこと・気づいたこと</p>
  <textarea id="reflection"
    placeholder="例：今日は比較級の使い方を学んだ。more を使う形と -er をつける形の違いが少しわかった。"></textarea>
</div>

<div class="section">
  <h3>② Questions & Expressions</h3>
  <p>疑問に思ったこと・Small Talkで言いたかったけど言えなかった表現</p>
  <textarea id="question"
    placeholder="例：「雰囲気が崩れる」って英語でどう言えばいいかわからなかった。"></textarea>
</div>

<div class="section">
  <h3>③ Message to Teacher</h3>
  <p>先生に伝えたいこと・聞きたいこと</p>
  <textarea id="message"
    placeholder="例：次回もう一度、関係詞の説明を聞きたいです。"></textarea>
</div>

<div class="section">
  <h3>⭐ Self Evaluation</h3>
  <p>今日の理解度を選んでください。</p>

  <select id="evaluation">
    <option>5 😀 よく理解できた</option>
    <option>4 🙂 だいたい理解できた</option>
    <option>3 😐 ふつう</option>
    <option>2 😕 少し難しかった</option>
    <option>1 😵 かなり難しかった</option>
  </select>
</div>

<button id="submitBtn">提出する</button>

<script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

  import {
  getFirestore,
  collection,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";
  import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged,
  signInWithEmailAndPassword,
createUserWithEmailAndPassword  
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyC0v6j94bU_51gk3UxkD9XJevhJ128Xtzo",
    authDomain: "ganmo-reflection-hub.firebaseapp.com",
    projectId: "ganmo-reflection-hub",
    storageBucket: "ganmo-reflection-hub.firebasestorage.app",
    messagingSenderId: "308447845168",
    appId: "1:308447845168:web:f97ffa59996d78d29406f5"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const auth = getAuth(app);
const provider = new GoogleAuthProvider();
  document.getElementById("loginBtn").addEventListener("click", async () => {
  await signInWithPopup(auth, provider);
});

document.getElementById("emailLoginBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  await signInWithEmailAndPassword(auth, email, password);
});

document.getElementById("signupBtn").addEventListener("click", async () => {
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  await createUserWithEmailAndPassword(auth, email, password);
});
  
document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
});

let currentUser = null;

onAuthStateChanged(auth, (user) => {
  currentUser = user;

  if (user) {
document.getElementById("userInfo").innerHTML =
  `${user.displayName || user.email} さんでログイン中`;
  } else {
    document.getElementById("userInfo").innerHTML =
      "ログインしていません";
  }
});

  document.getElementById("submitBtn").addEventListener("click", async () => {

  const grade =
  document.getElementById("grade").value;

const className =
  document.getElementById("className").value;

const lessonName =
  document.getElementById("lessonName").value;
    
  const reflection =
    document.getElementById("reflection").value;

  const question =
    document.getElementById("question").value;

  const message =
    document.getElementById("message").value;

  const evaluation =
    document.getElementById("evaluation").value;

  try {

    await addDoc(
      collection(db, "reflections"),
     {
  userName: currentUser ? currentUser.displayName : "未ログイン",
  userEmail: currentUser ? currentUser.email : "未ログイン",
  userId: currentUser ? currentUser.uid : "未ログイン",

grade: grade,
className: className,
lessonName: lessonName,
       
  reflection: reflection,
  question: question,
  message: message,
  evaluation: evaluation,
  createdAt: new Date()
}
    );

    alert("提出完了！");

  } catch (error) {

    console.error(error);

    alert("保存に失敗しました");

  }

});
</script>
