<style>
body {
  font-family: Arial;
  max-width: 1000px;
  margin: auto;
  padding: 20px;
}

h1 {
  color: navy;
}

.card {
  border: 1px solid lightgray;
  border-radius: 10px;
  padding: 15px;
  margin: 15px 0;
}

.meta {
  color: gray;
  font-size: 14px;
}

button {
  background-color: lightblue;
  padding: 10px;
  cursor: pointer;
}

button:hover {
  background-color: skyblue;
}

.selected-row {
  background-color: #dff0ff;
}
  
table {
  width: 100%;
  border-collapse: collapse;
  margin-bottom: 25px;
}

th, td {
  border: 1px solid lightgray;
  padding: 8px;
  text-align: left;
  vertical-align: top;
}

th {
  background-color: #f0f4ff;
}  
</style>

<h1>👨‍🏫 Teacher Dashboard</h1>

<button id="loginBtn">Googleでログイン</button>
<button id="logoutBtn">ログアウト</button>
<p id="userInfo">ログインしていません</p>

<div class="card">
  <h3>🔍 絞り込み</h3>

  <p>生徒名</p>
<input type="text" id="filterName" placeholder="例：田中">
  
  <p>日付</p>
<input type="date" id="filterDate">

  <p>学年</p>
  <select id="filterGrade">
    <option value="all">すべて</option>
    <option>1年</option>
    <option>2年</option>
    <option>3年</option>
  </select>

  <p>クラス</p>
  <select id="filterClass">
    <option value="all">すべて</option>
    <option>1組</option>
    <option>2組</option>
    <option>3組</option>
    <option>4組</option>
    <option>5組</option>
    <option>6組</option>
    <option>7組</option>
    <option>8組</option>
  </select>

  <p>授業名</p>
  <select id="filterLesson">
    <option value="all">すべて</option>
    <option>英語コミュニケーションⅠ</option>
    <option>英語コミュニケーションⅡ</option>
    <option>英語コミュニケーションⅢ</option>
    <option>論理・表現Ⅰ</option>
    <option>論理・表現Ⅱ</option>
    <option>論理・表現Ⅲ</option>
  </select>

<p>並び替え</p>

<select id="sortOrder">

  <option value="dateDesc">新しい順</option>

  <option value="dateAsc">古い順</option>

  <option value="nameAsc">氏名順</option>

  <option value="evaluationDesc">評価高い順</option>

</select>
  
  <br><br>

  <button id="filterBtn">絞り込む</button>
  &nbsp;
  <button id="resetFilterBtn">リセット</button>
  &nbsp;
  <button id="csvBtn">CSVダウンロード</button>
  &nbsp;
<button id="wordCloudBtn">ワードクラウド生成</button>
</div>

<h2>ワードクラウド</h2>

<canvas
  id="wordCloudCanvas"
  width="900"
  height="400"
  style="border:1px solid lightgray;"
></canvas>

<h2>頻出単語ランキング</h2>

<div id="wordRanking"
     class="card">
  まだ生成されていません
</div>

<h2>提出された振り返り</h2>

<table>
  <thead>
    <tr>
      <th>日時</th>
      <th>氏名</th>
      <th>学年</th>
      <th>クラス</th>
      <th>授業名</th>
      <th>自己評価</th>
    </tr>
  </thead>
  <tbody id="reflectionTableBody">
  </tbody>
</table>

<h2>詳細</h2>

<div id="reflectionDetail" class="card">
  表の行をクリックすると詳細が表示されます。
</div>

<div id="reflectionList" style="display:none;"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/wordcloud2.js/1.2.2/wordcloud2.min.js"></script>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.14.0/firebase-app.js";

import {
  getFirestore,
  collection,
  getDocs,
  orderBy,
  query
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-firestore.js";

import {
  getAuth,
  GoogleAuthProvider,
  signInWithPopup,
  signOut,
  onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.14.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyC0v6j94bU_51gk3UxkD9XJevhJ128Xtzo",
  authDomain: "ganmo-reflection-hub.firebaseapp.com",
  projectId: "ganmo-reflection-hub",
  storageBucket: "ganmo-reflection-hub.firebasestorage.app",
  messagingSenderId: "308447845168",
  appId: "1:308447845168:web:f97ffa59996d78d29406f5"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);
const auth = getAuth(app);
const provider = new GoogleAuthProvider();
let currentData = [];

const STOP_WORDS = [
  "the","a","an","to","of","and","is","are",
  "i","you","he","she","it","we","they",
  "was","were","be","have","has","had",
  "in","on","at","for","with","this","that"
];  

document.getElementById("loginBtn").addEventListener("click", async () => {
  await signInWithPopup(auth, provider);
});

document.getElementById("logoutBtn").addEventListener("click", async () => {
  await signOut(auth);
});

document.getElementById("filterBtn").addEventListener("click", () => {
  loadReflections();
});  

document.getElementById("resetFilterBtn").addEventListener("click", () => {

  document.getElementById("filterDate").value = "";

  document.getElementById("filterName").value = "";

  document.getElementById("filterGrade").value = "all";

  document.getElementById("filterClass").value = "all";

  document.getElementById("filterLesson").value = "all";

  loadReflections();

});
document.getElementById("csvBtn").addEventListener("click", () => {

  if (currentData.length === 0) {
    alert("出力するデータがありません");
    return;
  }

  const headers = [
    "日時",
    "氏名",
    "メール",
    "学年",
    "クラス",
    "授業名",
    "今日の振り返り",
    "疑問・言いたかった表現",
    "先生へのメッセージ",
    "自己評価"
  ];

  const rows = currentData.map(data => [
    data.createdAt ? data.createdAt.toDate().toLocaleString() : "",
    data.userName || "",
    data.userEmail || "",
    data.grade || "",
    data.className || "",
    data.lessonName || "",
    data.reflection || "",
    data.question || "",
    data.message || "",
    data.evaluation || ""
  ]);

  const csvContent = [
    headers,
    ...rows
  ].map(row =>
    row.map(value =>
      `"${String(value).replace(/"/g, '""')}"`
    ).join(",")
  ).join("\n");

  const bom = "\uFEFF";
  const blob = new Blob([bom + csvContent], {
    type: "text/csv;charset=utf-8;"
  });

  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");

  link.href = url;
  link.download = "reflection_data.csv";
  link.click();

  URL.revokeObjectURL(url);
});

document.getElementById("wordCloudBtn")

.addEventListener("click", generateWordCloud);
  
onAuthStateChanged(auth, (user) => {
  if (user) {

  document.getElementById("userInfo").innerHTML =
    `${user.displayName} さんでログイン中`;

  const teacherEmails = [
    "yuutaka04@gmail.com"
  ];

  if (!teacherEmails.includes(user.email)) {

  document.body.innerHTML = `
    <h1>⛔ 閲覧権限がありません</h1>

    <p>
      このページは教員専用です。<br>
      生徒の方は振り返りページをご利用ください。
    </p>

    <button onclick="window.location.href='index.html'">
      振り返りページへ戻る
    </button>
  `;

  return;
}

  loadReflections();

} else {
    document.getElementById("userInfo").innerHTML =
      "ログインしていません";

    document.getElementById("reflectionList").innerHTML =
      "ログインすると提出一覧を表示します。";
  }
});

async function loadReflections() {
  const reflectionList = document.getElementById("reflectionList");
const reflectionTableBody = document.getElementById("reflectionTableBody");

reflectionList.innerHTML = "読み込み中...";
reflectionTableBody.innerHTML = "";

  const q = query(
    collection(db, "reflections"),
    orderBy("createdAt", "desc")
  );

  const querySnapshot = await getDocs(q);

reflectionList.innerHTML = "";
currentData = [];

let dataArray = [];

querySnapshot.forEach((doc) => {
  dataArray.push(doc.data());
});

const sortOrder =
  document.getElementById("sortOrder").value;

if (sortOrder === "dateAsc") {
  dataArray.sort((a, b) =>
    a.createdAt.seconds - b.createdAt.seconds
  );
}

if (sortOrder === "dateDesc") {
  dataArray.sort((a, b) =>
    b.createdAt.seconds - a.createdAt.seconds
  );
}

if (sortOrder === "nameAsc") {
  dataArray.sort((a, b) =>
    (a.userName || "").localeCompare(b.userName || "", "ja")
  );
}

if (sortOrder === "evaluationDesc") {
  dataArray.sort((a, b) =>
    parseInt(b.evaluation) - parseInt(a.evaluation)
  );
}

dataArray.forEach((data) => {

const filterGrade = document.getElementById("filterGrade").value;
const filterClass = document.getElementById("filterClass").value;
const filterLesson = document.getElementById("filterLesson").value;

const filterName = document.getElementById("filterName").value.trim();
    
const filterDate = document.getElementById("filterDate").value;
    if (filterDate !== "") {
  const submittedDate =
  data.createdAt.toDate().toLocaleDateString("sv-SE");

  if (submittedDate !== filterDate) return;
}

if (filterName !== "" && !(data.userName || "").includes(filterName)) return;
    
if (filterGrade !== "all" && data.grade !== filterGrade) return;
if (filterClass !== "all" && data.className !== filterClass) return;
if (filterLesson !== "all" && data.lessonName !== filterLesson) return;

currentData.push(data);
const row = document.createElement("tr");

row.innerHTML = `
  <td>${data.createdAt ? data.createdAt.toDate().toLocaleString() : ""}</td>
  <td>${data.userName || ""}</td>
  <td>${data.grade || ""}</td>
  <td>${data.className || ""}</td>
  <td>${data.lessonName || ""}</td>
  <td>${data.evaluation || ""}</td>
`;

row.addEventListener("click", () => {

  document
    .querySelectorAll("tbody tr")
    .forEach(r => r.classList.remove("selected-row"));

  row.classList.add("selected-row");

  showDetail(data);

});
    
reflectionTableBody.appendChild(row);    
    
    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="meta">
        ${data.createdAt ? data.createdAt.toDate().toLocaleString() : ""}
      </div>

      <h3>${data.userName || "名前なし"}</h3>
      <div class="meta">${data.userEmail || ""}</div>

      <div class="meta">
  ${data.grade || ""}　
  ${data.className || ""}　
  ${data.lessonName || ""}
</div>

      <h4>① Today's Reflection</h4>
      <p>${data.reflection || ""}</p>

      <h4>② Questions & Expressions</h4>
      <p>${data.question || ""}</p>

      <h4>③ Message to Teacher</h4>
      <p>${data.message || ""}</p>

      <h4>⭐ Self Evaluation</h4>
      <p>${data.evaluation || ""}</p>
    `;

    reflectionList.appendChild(card);
  });
}

function showDetail(data) {
  const detail = document.getElementById("reflectionDetail");

  detail.innerHTML = `
    <div class="meta">
      ${data.createdAt ? data.createdAt.toDate().toLocaleString() : ""}
    </div>

    <h3>${data.userName || "名前なし"}</h3>
    <div class="meta">${data.userEmail || ""}</div>

    <div class="meta">
      ${data.grade || ""}　
      ${data.className || ""}　
      ${data.lessonName || ""}
    </div>

    <h4>① Today's Reflection</h4>
    <p>${data.reflection || ""}</p>

    <h4>② Questions & Expressions</h4>
    <p>${data.question || ""}</p>

    <h4>③ Message to Teacher</h4>
    <p>${data.message || ""}</p>

    <h4>⭐ Self Evaluation</h4>
    <p>${data.evaluation || ""}</p>
  `;
}

function generateWordCloud() {
  const canvas =

    document.getElementById("wordCloudCanvas");

  const ctx = canvas.getContext("2d");

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  let text = "";

  currentData.forEach(data => {

    text += " " + (data.reflection || "");

    text += " " + (data.question || "");

    text += " " + (data.message || "");

  });

  const words =

    text

      .toLowerCase()

      .replace(/[.,!?()]/g, "")

      .split(/\s+/);

  const counts = {};

  words.forEach(word => {

    if (

      word.length < 3 ||

      STOP_WORDS.includes(word)

    ) return;

    counts[word] = (counts[word] || 0) + 1;

  });

  const sortedWords =

    Object.entries(counts)

      .sort((a, b) => b[1] - a[1])

      .slice(0, 50);

  sortedWords.forEach(([word, count]) => {

    const size =

      Math.min(50, 14 + count * 4);

    const x =

      Math.random() * (canvas.width - 100);

    const y =

      Math.random() * (canvas.height - 30);

    ctx.font = `${size}px Arial`;

    ctx.fillStyle =

      `hsl(${Math.random()*360},70%,45%)`;

    ctx.fillText(word, x, y);

  });

let rankingHtml = "<ol>";

sortedWords.slice(0, 20).forEach(([word, count]) => {

  rankingHtml +=
    `<li>${word} (${count}回)</li>`;

});

rankingHtml += "</ol>";

document.getElementById("wordRanking")
.innerHTML = rankingHtml;
  
}  
</script>
